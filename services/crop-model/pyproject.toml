[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-crop-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["field-shift-models==0.1.0", "field-shift-contracts==0.1.0"]

[tool.setuptools.packages.find]
include = ["crop_runtime*"]

[tool.uv.sources]
field-shift-models = { path = "../../packages/field-shift-models", editable = true }
field-shift-contracts = { path = "../../packages/field-shift-contracts", editable = true }
field-shift-science = { path = "../../packages/field-shift-science", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
