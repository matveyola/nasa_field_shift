[project]
name = "field-shift-agent"
version = "0.1.0"
description = "Field Shift AI agent: contracts (M0), service (M1), LLM agent with tools and grounding (M2)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3,<4",
    "pydantic>=2.11,<3",
    "pypdf>=7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "pytest>=8",
]
rag = [
    "psutil>=7.2.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
