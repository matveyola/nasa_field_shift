[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-ml"
version = "0.1.0"
description = "Offline model training and evaluation for the Field Shift checkout"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
field_shift_ml = ["evaluations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../apps/api/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["field_shift", "field_shift_ml"]
