[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-science"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "redis>=5,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"field_shift_science.crops" = ["assets/referencecropcalendar*"]
"field_shift_science.geo_ml" = ["artifacts/*.json"]
"field_shift_science.simulation" = ["artifacts/*.json"]
"field_shift_science.rotations" = ["artifacts/*.json"]

"field_shift_science.layered_water" = ["NOTICE.md", "source-receipt.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
