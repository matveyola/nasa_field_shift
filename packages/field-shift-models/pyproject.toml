[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-models"
version = "0.1.0"
description = "Isolated crop engine adapters and offline evaluation for planning-v1"
requires-python = ">=3.12,<3.13"
dependencies = ["field-shift-contracts==0.1.0", "field-shift-science==0.1.0", "aquacrop==3.1.0", "pcse==6.0.13", "pydantic==2.12.5", "scikit-learn==1.8.0"]

[project.optional-dependencies]
ruslan = ["lightgbm==4.6.0"]

[tool.setuptools.package-data]
"field_shift_models.ruslan" = ["assets/*.json", "assets/*.txt", "NOTICE.md"]

[project.scripts]
field-shift-models = "field_shift_models.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "lightgbm==4.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
field-shift-contracts = { path = "../field-shift-contracts", editable = true }
field-shift-science = { path = "../field-shift-science", editable = true }
