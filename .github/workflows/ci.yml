name: CI

on:
  push:
    branches: [main, nazar-jobs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent_tooling:
    name: Development agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.0'
          python-version: '3.12'
      - run: uv run --no-project --python 3.12 python infra/verify.py --mode tooling
      - run: uvx --from ruff==0.17.4 ruff check --config apps/api/pyproject.toml infra/check_agent_tree.py infra/test_agent_tree.py infra/test_ci_paths.py infra/verify_cpu_benchmark.py infra/test_cpu_benchmark.py infra/verify.py infra/test_verify.py
      - run: uvx --from ruff==0.17.4 ruff format --check --config apps/api/pyproject.toml infra/check_agent_tree.py infra/test_agent_tree.py infra/test_ci_paths.py infra/verify_cpu_benchmark.py infra/test_cpu_benchmark.py infra/verify.py infra/test_verify.py

  python_packages:
    name: Installed Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - run: python3 infra/verify_python_wheels.py --output /tmp/python-wheel-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-wheel-verification
          path: /tmp/python-wheel-verification

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.detect.outputs.api }}
      agent: ${{ steps.detect.outputs.agent }}
      boundary_model: ${{ steps.detect.outputs.boundary_model }}
      agent_reference: ${{ steps.detect.outputs.agent_reference }}
      web: ${{ steps.detect.outputs.web }}
      integration: ${{ steps.detect.outputs.integration }}
      ml: ${{ steps.detect.outputs.ml }}
      planning: ${{ steps.detect.outputs.planning }}
      rotation_model: ${{ steps.detect.outputs.rotation_model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changes"
          else
            git ls-files > "$RUNNER_TEMP/changes"
          fi
          awk '
            /^(apps\/api\/|\.github\/workflows\/ci\.yml)/ { api = 1 }
            /^services\/agent\/contracts\// { api = 1 }
            /^services\/agent\/tests\/fixtures\/(host_constraints|host_signed_turn)\.json$/ { api = 1 }
            /^(services\/boundary-model\/|compose(\.boundary-model)?\.yaml$|apps\/web\/public\/bondurant-usgs-aerial\.webp$|\.github\/workflows\/ci\.yml$)/ { boundary_model = 1 }
            /^services\/agent\/(agent_service|contracts|tests|integration_stub)\// { agent = 1 }
            /^services\/agent\/evals\// && !/^services\/agent\/evals\/reports\// { agent = 1 }
            /^(services\/agent\/(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock)$|compose\.yaml$|infra\/configure-agent\.py$|\.github\/workflows\/ci\.yml$)/ { agent = 1 }
            /^apps\/api\/src\/field_shift\/modules\/agent\/(signing|constraints|field_context|service)\.py$/ { agent = 1 }
            /^services\/agent\/frontend\// && !/^services\/agent\/frontend\/docs\// { agent_reference = 1 }
            /^(services\/agent\/(contracts\/|package(-lock)?\.json$|tsconfig\.json$|examples\/client\.ts$)|\.github\/workflows\/ci\.yml$)/ { agent_reference = 1 }
            /^(apps\/web\/|services\/agent\/frontend\/src\/widget\/|\.github\/workflows\/ci\.yml)/ { web = 1 }
            /^(apps\/api\/(src\/|tests\/integration\/|migrations\/|alembic\.ini|pyproject\.toml|uv\.lock|Dockerfile)|compose\.yaml|infra\/|\.github\/workflows\/ci\.yml)/ { integration = 1 }
            /^(packages\/field-shift-ml\/|apps\/api\/src\/field_shift\/modules\/(crops|fields|geo_ml|rotations|simulation|weather)\/|\.github\/workflows\/ci\.yml$)/ { ml = 1 }
            /^(contracts\/planning-v1\/|packages\/field-shift-models\/|services\/agent\/frontend\/src\/widget\/|services\/crop-model\/|apps\/api\/|apps\/web\/|compose\.yaml|infra\/|\.github\/workflows\/ci\.yml)/ { planning = 1 }
            /^packages\/field-shift-(contracts|science)\// { api = 1; ml = 1; planning = 1; integration = 1 }
            /^packages\/field-shift-science\// { rotation_model = 1 }
            /^(packages\/field-shift-rotation-model\/|services\/rotation-model\/|\.github\/workflows\/ci\.yml$)/ { rotation_model = 1; api = 1; planning = 1; integration = 1 }
            /^contracts\/planning-v1\// { api = 1; web = 1; integration = 1 }
            END {
              print "planning=" (planning ? "true" : "false")
              print "api=" (api ? "true" : "false")
              print "agent=" (agent ? "true" : "false")
              print "boundary_model=" (boundary_model ? "true" : "false")
              print "agent_reference=" (agent_reference ? "true" : "false")
              print "web=" (web ? "true" : "false")
              print "integration=" (integration ? "true" : "false")
              print "ml=" (ml ? "true" : "false")
              print "rotation_model=" (rotation_model ? "true" : "false")
            }' "$RUNNER_TEMP/changes" >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q -m "not integration"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/field-shift-ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: packages/field-shift-ml/uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - run: docker compose --profile agent config --quiet
        working-directory: .
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  boundary_model:
    needs: changes
    if: needs.changes.outputs.boundary_model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: field-shift-boundary-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and wait for the real CPU boundary model
        run: docker compose up --build --wait --wait-timeout 300 boundary-model
      - name: Check field masks over the private HTTP interface
        run: |
          docker compose cp apps/web/public/bondurant-usgs-aerial.webp boundary-model:/tmp/bondurant.webp
          docker compose exec -T boundary-model python - /tmp/bondurant.webp < services/boundary-model/smoke_test.py
      - name: Show model logs
        if: failure()
        run: docker compose logs --no-color boundary-model
      - name: Remove test containers and model volume
        if: always()
        run: docker compose down --volumes

  rotation_model:
    needs: changes
    if: needs.changes.outputs.rotation_model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: packages/field-shift-rotation-model/uv.lock
      - run: uv sync --project packages/field-shift-rotation-model --locked --extra benchmark
      - run: uv run --no-sync ruff check .
        working-directory: packages/field-shift-rotation-model
      - run: uv run --no-sync ruff format --check . && uv run --no-sync pytest -q
        working-directory: packages/field-shift-rotation-model
      - run: packages/field-shift-rotation-model/.venv/bin/python -m field_shift_rotation_model.benchmark --output "$RUNNER_TEMP/rotation-paired.json"
      - name: Preserve the paired numerical baseline
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'rotation-paired.json').read_text())
          expected = json.loads(Path('packages/field-shift-rotation-model/reports/paired-v3.json').read_text())
          assert actual == expected
          PY
      - run: docker build -f services/rotation-model/Dockerfile -t field-shift-rotation-model:ci .
      - name: Check the installed private HTTP boundary without network access
        run: |
          export FIELD_SHIFT_ROTATION_MODEL_TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d --name rotation-model-ci --network none --read-only \
            --tmpfs /tmp:size=256m --memory 2304m --cpus 1 --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env FIELD_SHIFT_ROTATION_MODEL_TOKEN field-shift-rotation-model:ci
          docker exec -i rotation-model-ci /opt/rotation-model/bin/python -I - <<'PY'
          import json, os, time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          base = 'http://127.0.0.1:8080'
          headers = {'Authorization': 'Bearer ' + os.environ['FIELD_SHIFT_ROTATION_MODEL_TOKEN']}
          for attempt in range(20):
              try:
                  with urlopen(Request(base + '/health', headers=headers), timeout=2) as response:
                      assert json.load(response)['status'] == 'ready'
                  break
              except URLError:
                  if attempt == 19:
                      raise
                  time.sleep(.5)
          try:
              urlopen(base + '/health', timeout=2)
              raise AssertionError('Private health accepted an unauthenticated request')
          except HTTPError as error:
              assert error.code == 401
          with urlopen(Request(base + '/catalog', data=b'{}', headers=headers), timeout=55) as response:
              catalog = json.load(response)
          assert len(catalog['crops']) == 13
          assert catalog['empirical_status'] == 'not_validated'
          PY
      - if: always()
        run: docker rm -f rotation-model-ci || true

  agent_reference:
    needs: changes
    if: needs.changes.outputs.agent_reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            services/agent/package-lock.json
            services/agent/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:ts
      - run: npm ci --ignore-scripts
        working-directory: services/agent/frontend
      - run: npm run check:validators
        working-directory: services/agent/frontend
      - run: npm test
        working-directory: services/agent/frontend
      - run: npm run build
        working-directory: services/agent/frontend

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: field_shift
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: field_shift
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U field_shift -d field_shift"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked --extra dev
      - run: docker compose config --quiet
        working-directory: .
      - name: Create isolated profile migration database
        env:
          PG_ADMIN_URL: postgresql://field_shift:ci@localhost:${{ job.services.postgres.ports['5432'] }}/field_shift
        run: uv run --no-sync python -c "import os, psycopg; c=psycopg.connect(os.environ['PG_ADMIN_URL'], autocommit=True); c.execute('CREATE DATABASE field_shift_profiles'); c.close()"
      - run: uv run --no-sync pytest -q -m integration
        env:
          ISSUE3_DATABASE_URL: postgresql+psycopg://field_shift:ci@localhost:${{ job.services.postgres.ports['5432'] }}/field_shift_profiles
          ISSUE5_POSTGRES_ADMIN_URL: postgresql://field_shift:ci@localhost:${{ job.services.postgres.ports['5432'] }}/field_shift
          FIELD_SHIFT_TEST_DATABASE_URL: postgresql+psycopg://field_shift:ci@localhost:${{ job.services.postgres.ports['5432'] }}/field_shift
          FIELD_SHIFT_TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/15
      - name: Restore a PostgreSQL archive
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql+psycopg://field_shift:ci@localhost:${{ job.services.postgres.ports['5432'] }}/field_shift
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m field_shift.seed
          uv run --no-sync python - <<'PY'
          from fastapi.testclient import TestClient
          from field_shift.api import app

          with TestClient(app) as client:
              response = client.post("/api/jobs", json={
                  "kind": "simulation", "field_id": "F-03", "inputs": {"season": 2026}
              })
              assert response.status_code == 202, response.text
          PY
          docker exec -i -e PGHOST=127.0.0.1 -e PGUSER=field_shift -e PGDATABASE=field_shift \
            -e PGPASSWORD=ci -e BACKUP_DIRECTORY=/tmp/field-shift-backup \
            "$POSTGRES_CONTAINER" sh -s -- --once < ../../infra/backup.sh
          docker exec "$POSTGRES_CONTAINER" sh -ec '
            createdb -U field_shift field_shift_restore
            pg_restore --exit-on-error -U field_shift -d field_shift_restore /tmp/field-shift-backup/*.dump
            [ "$(psql -U field_shift -d field_shift_restore -Atc "SELECT count(*) FROM fields")" = 3 ]
            [ "$(psql -U field_shift -d field_shift_restore -Atc "SELECT count(*) FROM jobs")" = 1 ]
          '

  planning:
    needs: changes
    if: needs.changes.outputs.planning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.0'
          python-version: '3.12.13'
          enable-cache: true
          cache-dependency-glob: |
            apps/api/uv.lock
            packages/field-shift-models/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: uv sync --project apps/api --locked --extra dev
      - run: uv sync --project packages/field-shift-models --locked --python 3.12.13
      - run: packages/field-shift-models/.venv/bin/python -m pytest -q packages/field-shift-models/tests
      - run: packages/field-shift-models/.venv/bin/python infra/verify_cpu_benchmark.py --check packages/field-shift-models/reports/cpu-v7.json --output-dir "$RUNNER_TEMP/field-shift-cpu-benchmark"
      - run: npm ci --prefix apps/web && npm ci --prefix services/agent && npm ci --prefix services/agent/frontend
      - run: apps/api/.venv/bin/python -m field_shift_contracts.planning_v1.export --repo-root . --check
      - run: node contracts/planning-v1/check.mjs && apps/web/node_modules/.bin/tsc -p contracts/planning-v1/tsconfig.json
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:planning --prefix apps/web
      - name: Check decision workspaces on desktop and mobile
        working-directory: apps/web
        run: |
          for config in tests/analytics/playwright.config.ts tests/strategies/playwright.config.ts playwright.workspace.config.ts; do
            ./node_modules/.bin/playwright test --config "$config"
          done
      - run: apps/api/.venv/bin/ruff check --config apps/api/pyproject.toml services/crop-model/crop_runtime
      - run: python3 infra/verify-planning.py
        env:
          PLANNING_VERIFY_PROJECT: planning-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-verification
          path: |
            apps/web/test-results
            /tmp/field-shift-planning-verification/report.json
            ${{ runner.temp }}/field-shift-cpu-benchmark/
          if-no-files-found: ignore

  required:
    name: Required checks
    if: always()
    needs: [agent_tooling, python_packages, changes, api, ml, agent, boundary_model, rotation_model, agent_reference, web, integration, planning]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
